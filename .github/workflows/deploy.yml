name: Test and deploy to GitHub Pages

on:
  push:
    # main deploys; claude/** branches only run the tests (WebKit can't run in the dev VM).
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Configure Pages (main only)
        id: pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Work out the site base path
        id: base
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
          REPO: ${{ github.event.repository.name }}
          IS_MAIN: ${{ steps.pages.conclusion == 'success' }}
        run: |
          if [ "$IS_MAIN" = "true" ]; then base="${PAGES_BASE}/"; else base="/${REPO}/"; fi
          echo "path=$base" >> "$GITHUB_OUTPUT"
          echo "Base path: $base"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: training/requirements.txt

      - name: Python feature tests (parity with TypeScript via golden vectors)
        run: |
          pip install -r training/requirements.txt
          python -m pytest -q training/tests

      - name: Unit tests (includes TypeScript side of feature parity)
        run: npm test

      - name: Urdu review table is up to date
        run: node scripts/gen-urdu-review.mjs && git diff --exit-code docs/URDU_REVIEW.md

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: End-to-end tests (fake camera, CPU delegate; WebKit smoke test)
        run: npx playwright test
        env:
          CI: 'true'
          BASE_PATH: ${{ steps.base.outputs.path }}

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Upload Pages artifact
        if: steps.pages.conclusion == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
